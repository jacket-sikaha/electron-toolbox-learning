# dev-app-update.yml —— 仅开发模式使用
#
# 为什么需要这个文件？
#   electron-updater 通过 `app-update.yml` 知道「去哪儿问版本」。
#   那个文件是 electron-builder 在【打包时】根据 package.json 的 build.publish
#   生成、并放进 resources/ 的 —— dev 模式下根本没有 resources/ 这一层。
#
#   官方给的出口是 autoUpdater.forceDevUpdateConfig = true，
#   打开后它会改读 `path.join(app.getAppPath(), "dev-app-update.yml")`。
#   （见 node_modules/electron-updater/out/ElectronAppAdapter.js:23）
#
# 注意：这里的 url 必须和 package.json 的 build.publish 保持一致，
#       否则你会遇到「dev 能测、打包后失效」这种最难查的一类偏差。

provider: generic
url: http://127.0.0.1:8080/updates

# 为什么这里必须补上 updaterCacheDirName？
#   抽查 D:\software\ElectronToolbox\resources\app-update.yml（打包时 electron-builder
#   生成的那一份真文件）里有这一行：updaterCacheDirName: electron-toolbox-learning-updater
#   而本文件最初漏了它，于是 electron-updater 走了回退分支：
#       node_modules/electron-updater/out/AppUpdater.js:545  const dirName = (await this.configOnDisk.value).updaterCacheDirName;
#       node_modules/electron-updater/out/AppUpdater.js:548  logger.error("updaterCacheDirName is not specified in app-update.yml ...")
#       node_modules/electron-updater/out/AppUpdater.js:550  const cacheDir = path.join(this.app.baseCachePath, dirName || this.app.name);
#   实测结果就是「dev 和打包后用的是两个不同目录」：
#       dev   → C:\Users\...\AppData\Local\electron-toolbox-learning\pending\...
#       生产  → C:\Users\...\AppData\Local\electron-toolbox-learning-updater\...
#   这不只是难看，它会让「已经下好的包」在两边看不见，差分下载也会因为
#   找不到本地旧安装包而静默退化成全量下载。
#   所以这里显式写死成和打包产物一模一样的值 —— dev 要与生产同构，不要各自一套。
updaterCacheDirName: electron-toolbox-learning-updater
